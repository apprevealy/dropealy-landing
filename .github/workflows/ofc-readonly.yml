name: Testar ofc sem aprovar ou publicar
on:
  push:
    branches: [integracao/checkouts-parceiros]
    paths:
      - scripts/test-ofc-readonly.mjs
      - .github/workflows/ofc-readonly.yml
permissions:
  contents: read
jobs:
  testar_ofc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Instalar navegador apenas no ambiente descartável
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: API real e checkouts salvos com aprovação apenas simulada no navegador local
        run: node scripts/test-ofc-readonly.mjs
      - name: Verificar que a aplicação não foi alterada
        run: git diff --exit-code -- src package.json package-lock.json vercel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ofc-testes-${{ github.run_id }}
          path: ofc-test-results/
          retention-days: 7
